openapi: 3.0.3

info:
  title: API рекомендательной системы учебных курсов
  description: API для подбора учебных курсов на основе интересов студента и ранее пройденных дисциплин.
  version: 1.0.0

servers:
  - url: https://example.com/api/v1

paths:
  /recommendations:
    post:
      summary: Получить рекомендации учебных курсов
      description: Формирует персональные рекомендации на основе интересов студента и пройденных дисциплин.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - interests
                - completedCourseIds
              properties:
                studentId:
                  type: integer
                  description: Уникальный идентификатор студента
                  example: 101

                interests:
                  type: array
                  minItems: 1
                  description: Список интересующих студента направлений
                  items:
                    type: string
                  example:
                    - Программирование
                    - Машинное обучение

                completedCourseIds:
                  type: array
                  description: Идентификаторы ранее пройденных курсов
                  items:
                    type: integer
                  example:
                    - 1
                    - 3
                    - 5

      responses:
        '200':
          description: Рекомендации успешно сформированы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'

        '400':
          description: Некорректные входные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_INPUT
                message: Необходимо указать хотя бы один интерес

        '503':
          description: Рекомендательный алгоритм временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: MODEL_UNAVAILABLE
                message: Сервис рекомендаций временно недоступен

  /recommendations/{studentId}:
    get:
      summary: Получить рекомендации студента
      description: Возвращает последние сформированные рекомендации для указанного студента.

      parameters:
        - name: studentId
          in: path
          required: true
          description: Уникальный идентификатор студента
          schema:
            type: integer
            minimum: 1
          example: 101

      responses:
        '200':
          description: Рекомендации успешно получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'

        '404':
          description: Рекомендации для указанного студента не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RECOMMENDATIONS_NOT_FOUND
                message: Рекомендации для студента не найдены

  /courses/{courseId}:
    get:
      summary: Получить информацию об учебном курсе
      description: Возвращает подробную информацию о выбранном учебном курсе.

      parameters:
        - name: courseId
          in: path
          required: true
          description: Уникальный идентификатор курса
          schema:
            type: integer
            minimum: 1
          example: 12

      responses:
        '200':
          description: Информация о курсе успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

        '404':
          description: Учебный курс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: COURSE_NOT_FOUND
                message: Курс с указанным идентификатором не найден

components:
  schemas:

    Course:
      type: object
      description: Информация об учебном курсе
      properties:
        courseId:
          type: integer
          description: Уникальный идентификатор курса
          example: 12

        title:
          type: string
          description: Название учебного курса
          example: Основы машинного обучения

        description:
          type: string
          description: Краткое описание курса
          example: Введение в алгоритмы машинного обучения и анализ данных.

    Recommendation:
      type: object
      description: Рекомендованный учебный курс
      properties:
        courseId:
          type: integer
          description: Идентификатор рекомендованного курса
          example: 12

        title:
          type: string
          description: Название курса
          example: Основы машинного обучения

        description:
          type: string
          description: Краткое описание курса
          example: Изучение базовых алгоритмов машинного обучения.

        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Оценка соответствия курса интересам студента от 0 до 1
          example: 0.92

    RecommendationsResponse:
      type: object
      description: Результат работы рекомендательной системы
      properties:
        studentId:
          type: integer
          description: Идентификатор студента
          example: 101

        recommendations:
          type: array
          description: Список рекомендованных учебных курсов
          items:
            $ref: '#/components/schemas/Recommendation'

        modelVersion:
          type: string
          description: Версия рекомендательного алгоритма
          example: "1.0"

    ErrorResponse:
      type: object
      description: Информация об ошибке
      properties:
        code:
          type: string
          description: Код ошибки
          example: INVALID_INPUT

        message:
          type: string
          description: Описание ошибки
          example: Переданы некорректные входные данные